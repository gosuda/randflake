name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  go:
    name: Go
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Test Go
        run: go test -v ./...

  python:
    name: Python
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Compile Python
        run: python -m compileall -q src/randflake

      - name: Test Python
        run: python -m unittest discover -s src/randflake -t src

  typescript:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install TypeScript dependencies
        run: bash .github/scripts/npm-ci-with-logs.sh

      - name: Build TypeScript
        run: npm run build

      - name: Test TypeScript
        run: npm test

  jsr:
    name: JSR dry run
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install TypeScript dependencies
        run: bash .github/scripts/npm-ci-with-logs.sh

      - name: Build workspace dependency
        run: npm run build --workspace sparx64

      - name: Verify sparx64 JSR package
        working-directory: src/randflake-ts/sparx64
        run: npx --no-install jsr publish --dry-run

      - name: Verify randflake JSR package
        working-directory: src/randflake-ts/randflake
        run: npx --no-install jsr publish --dry-run

  release-diagnostics:
    name: Read v2.1.0 npm failure
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Report sanitized npm failure categories
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          log=$(mktemp)
          error=$(mktemp)
          trap 'rm -f -- "$log" "$error"' EXIT
          if ! gh run view --repo "$GITHUB_REPOSITORY" --job 102300000507 --log > "$log" 2> "$error"; then
            python3 - "$error" <<'PY'
          import re
          import sys
          from pathlib import Path
          text = Path(sys.argv[1]).read_text(errors="replace")
          codes = re.findall(r"HTTP (\d{3})", text)
          for code in codes or ["UNKNOWN"]:
              print(f"::notice title=Release diagnostic::LOG_FETCH_FAILED_{code}")
          PY
            exit 1
          fi
          python3 - "$log" <<'PY'
          import re
          import sys
          from pathlib import Path

          text = Path(sys.argv[1]).read_text(errors="replace")
          codes = sorted(set(re.findall(r"npm (?:error|ERR!) code ([A-Z][A-Z0-9_]*)", text)))
          lower = text.lower()
          signals = {
              "TOKEN_EXPIRED_OR_REVOKED": "expired or revoked" in lower,
              "TWO_FACTOR_OR_BYPASS_TOKEN_REQUIRED": "two-factor authentication" in lower,
              "LOGIN_REQUIRED": "need auth" in lower or "authorize this machine" in lower,
              "PACKAGE_CONTENT_MISMATCH": "different package contents" in lower,
          }
          categories = codes + [name for name, found in signals.items() if found]
          categories += ["REGISTRY_HTTP_" + code for code in re.findall(r"registry HTTP (\d{3})", text)]
          if not categories:
              categories = ["UNCLASSIFIED_NPM_FAILURE"]
          operation = re.search(r"Command failed: npm (pack|publish)", text)
          if operation:
              categories.append("NPM_COMMAND_" + operation.group(1).upper())
          for method, path in sorted(set(re.findall(r"\b(GET|PUT|POST) https://registry\.npmjs\.org/([^\s?#]+)", text))):
              package = path.split("/", 1)[0]
              if package not in ("sparx64", "randflake"):
                  package = "OTHER_PACKAGE"
              categories.append(f"NPM_REQUEST_{method}_{package}")
          for category in categories:
              print(f"::notice title=Release diagnostic::{category}")
          PY
