name: Node.js Package Publish NPM

on:
  release:
    types: [created]
  workflow_call:
    secrets:
      npm_token:
        required: true

permissions:
  contents: read

concurrency:
  group: npm-publish-${{ github.event.release.tag_name || github.ref_name }}
  cancel-in-progress: false

jobs:
  publish-npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: latest
          registry-url: https://registry.npmjs.org/

      - name: Install TypeScript dependencies
        run: bash .github/scripts/npm-ci-with-logs.sh

      - name: Build TypeScript packages
        run: npm run build

      - name: Test TypeScript packages
        run: npm test

      - name: Publish npm packages
        run: node .github/scripts/publish-npm.mjs
        env:
          NODE_AUTH_TOKEN: ${{ secrets.npm_token }}
